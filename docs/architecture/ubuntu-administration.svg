<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu-Administration</title>
  <desc id="desc">Administrator greift per SSH auf ein Ubuntu-System zu. Dienste, Firewall, Logs, Backup und Monitoring werden als zusammenhängende Administrationsbereiche betrachtet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6fdc"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#ffffff;stroke:#dce5ef;stroke-width:2}
      .accent{fill:#edf5ff;stroke:#0b6fdc;stroke-width:2}
      .dark{fill:#142033}
      .muted{fill:#607087}
      .line{stroke:#0b6fdc;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .line-dashed{stroke:#0b6fdc;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#142033}
      .h{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#142033}
      .t{font:500 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#607087}
      .s{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#607087}
      .label{font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0b6fdc}
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>

  <text class="title" x="60" y="58">Ubuntu-Administration</text>
  <text class="t" x="60" y="88">Dienste, Netzwerk, Sicherheit und Diagnose zusammenhängend prüfen</text>

  <rect class="box" x="60" y="200" rx="18" ry="18" width="220" height="105"/>
  <text class="h" x="97" y="242">Administrator</text>
  <text class="t" x="104" y="274">SSH · Terminal</text>

  <rect class="accent" x="440" y="200" rx="18" ry="18" width="300" height="120"/>
  <text class="h" x="510" y="245">Ubuntu-System</text>
  <text class="t" x="490" y="278">Benutzer · Rechte · Pakete</text>
  <text class="s" x="513" y="302">lokales Admin-Lab</text>

  <path class="line" d="M280 252 H440"/>
  <text class="label" x="336" y="235">SSH</text>

  <rect class="box" x="840" y="115" rx="18" ry="18" width="280" height="95"/>
  <text class="h" x="913" y="153">systemd</text>
  <text class="t" x="880" y="181">Dienste · Timer · Status</text>

  <rect class="box" x="840" y="235" rx="18" ry="18" width="280" height="95"/>
  <text class="h" x="923" y="273">UFW</text>
  <text class="t" x="875" y="301">Ports · Firewall · Netzwerk</text>

  <rect class="box" x="840" y="355" rx="18" ry="18" width="280" height="95"/>
  <text class="h" x="905" y="393">journalctl</text>
  <text class="t" x="888" y="421">Logs · Fehlerdiagnose</text>

  <rect class="box" x="440" y="405" rx="18" ry="18" width="300" height="95"/>
  <text class="h" x="510" y="443">Backup / Restore</text>
  <text class="t" x="491" y="471">Wiederherstellung prüfen</text>

  <rect class="box" x="60" y="405" rx="18" ry="18" width="270" height="95"/>
  <text class="h" x="98" y="443">Healthchecks</text>
  <text class="t" x="89" y="471">Monitoring · Quality Gates</text>

  <path class="line-dashed" d="M740 235 L840 165"/>
  <path class="line-dashed" d="M740 260 H840"/>
  <path class="line-dashed" d="M740 290 L840 402"/>
  <path class="line-dashed" d="M590 320 V405"/>
  <path class="line-dashed" d="M440 275 L270 405"/>

  <rect class="accent" x="60" y="565" rx="18" ry="18" width="1060" height="82"/>
  <text class="h" x="100" y="602">Diagnosepfad</text>
  <text class="t" x="290" y="602">Systemstatus → Dienst → Port → Firewall → Netzwerkpfad → Logs → Konfiguration</text>
  <text class="s" x="290" y="628">Schrittweise Ursache eingrenzen statt einzelne Befehle blind auszuführen</text>
</svg>